<!DOCTYPE html>
<html lang="ru" data-layout="auto" data-motion="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Media Hub — афиша · флот</title>
  <style>
    :root {
      --ink: #0e1418;
      --ink-2: #162028;
      --fog: #c8d2d8;
      --fog-dim: rgba(200, 210, 216, 0.55);
      --paper: #e8eef1;
      --route: #d4a24a;
      --pulse: #3ecfb2;
      --control: #7eb6d4;
      --media: #d4a24a;
      --edge: #3ecfb2;
      --anchor: #3dce6e;
      --anchor-glow: rgba(61, 206, 110, 0.5);
      --fleet: #5b8fd4;
      --fleet-dim: rgba(91, 143, 212, 0.4);
      --brand: "Syne", "Avenir Next", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "Consolas", "Cascadia Mono", monospace;
      --body: "Source Sans 3", "Segoe UI", "Helvetica Neue", sans-serif;
    }

    @font-face {
      font-family: "Syne";
      font-style: normal;
      font-weight: 700 800;
      font-display: swap;
      src: local("Syne"), local("Avenir Next Bold");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      cursor: default;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      isolation: isolate;
    }

    #field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 70% at 50% 45%, transparent 35%, rgba(8, 12, 16, 0.72) 100%),
        linear-gradient(180deg, rgba(14, 20, 24, 0.15), transparent 30%, rgba(14, 20, 24, 0.35));
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.35;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
    }

    .frame {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      padding: clamp(1.25rem, 3.5vw, 3rem);
      gap: clamp(1rem, 2.5vw, 2rem);
      pointer-events: none;
    }

    html[data-layout="landscape"] .frame {
      grid-template-columns: minmax(14rem, 0.95fr) minmax(0, 1.55fr);
      grid-template-rows: 1fr auto;
      grid-template-areas:
        "brand graph"
        "meta  graph";
      align-items: stretch;
    }

    html[data-layout="portrait"] .frame {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr auto;
      grid-template-areas:
        "brand"
        "graph"
        "meta";
    }

    .brand {
      grid-area: brand;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.85rem;
      max-width: 28rem;
    }

    html[data-layout="portrait"] .brand {
      max-width: none;
      align-items: flex-start;
      padding-top: 0.5rem;
    }

    .brand-kicker {
      font-family: var(--mono);
      font-size: clamp(0.65rem, 1.1vw, 0.8rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fog-dim);
    }

    .brand-title {
      font-family: var(--brand);
      font-weight: 800;
      font-size: clamp(2.6rem, 7.5vw, 5.6rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      color: var(--paper);
      text-wrap: balance;
    }

    .brand-title span {
      display: inline-block;
      background: linear-gradient(120deg, var(--paper) 0%, var(--anchor) 40%, var(--fleet) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: brand-sheen 10s ease-in-out infinite;
    }

    .brand-lead {
      font-size: clamp(0.95rem, 1.6vw, 1.2rem);
      line-height: 1.45;
      color: var(--fog);
      max-width: 24rem;
    }

    html[data-layout="portrait"] .brand-lead {
      max-width: 34rem;
    }

    .meta {
      grid-area: meta;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      align-items: flex-end;
      font-family: var(--mono);
      font-size: clamp(0.62rem, 1vw, 0.75rem);
      letter-spacing: 0.08em;
      color: var(--fog-dim);
    }

    .meta b { color: var(--fog); font-weight: 500; }
    .meta .live { color: var(--anchor); }

    .graph-wrap {
      grid-area: graph;
      position: relative;
      min-height: 0;
      min-width: 0;
    }

    #graph {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .node-core {
      fill: var(--ink-2);
      stroke-width: 1.5;
      transform-origin: center;
      transform-box: fill-box;
    }

    .node-ring {
      fill: none;
      stroke-width: 1;
      opacity: 0.55;
    }

    .node-control .node-core,
    .node-control .node-ring { stroke: var(--control); }
    .node-media .node-core,
    .node-media .node-ring { stroke: var(--media); }

    .node-anchor .node-core {
      stroke: var(--anchor);
      stroke-width: 2.25;
      fill: #1a1410;
    }
    .node-anchor .node-ring { stroke: var(--anchor); }
    .node-anchor .node-glow {
      fill: var(--anchor);
      opacity: 0.12;
    }

    .node-fleet .node-core {
      stroke: var(--fleet);
      stroke-width: 1.25;
      fill: #12181e;
    }
    .node-fleet .node-ring { stroke: var(--fleet); opacity: 0.4; }

    .node-label {
      fill: var(--paper);
      font-family: var(--brand);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .node-anchor .node-label {
      fill: var(--anchor);
      font-size: 16px;
    }

    .node-fleet .node-label {
      fill: var(--fog);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
      letter-spacing: 0.04em;
    }

    .node-sub {
      fill: var(--fog-dim);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .edge-path {
      fill: none;
      stroke-linecap: round;
      stroke-width: 1.5;
      opacity: 0.55;
    }

    .edge-control { stroke: var(--control); stroke-dasharray: 5 8; }
    .edge-media { stroke: var(--route); stroke-width: 2.25; }
    .edge-orch { stroke: var(--fog-dim); stroke-dasharray: 2 10; stroke-width: 1.25; }
    .edge-fleet-c {
      stroke: var(--control);
      stroke-width: 1.1;
      stroke-dasharray: 3 7;
      opacity: 0.4;
    }
    .edge-fleet-m {
      stroke: var(--fleet);
      stroke-width: 1.4;
      opacity: 0.45;
    }
    .edge-anchor-c {
      stroke: var(--control);
      stroke-dasharray: 5 8;
      stroke-width: 1.75;
      opacity: 0.7;
    }
    .edge-anchor-m {
      stroke: var(--anchor);
      stroke-width: 2.6;
      opacity: 0.75;
      filter: drop-shadow(0 0 5px var(--anchor-glow));
    }

    .edge-flow {
      fill: none;
      stroke-linecap: round;
      stroke-width: 2.5;
      stroke-dasharray: 10 120;
      filter: drop-shadow(0 0 4px rgba(62, 207, 178, 0.35));
      pointer-events: none;
    }

    .flow-control { stroke: var(--control); }
    .flow-media { stroke: var(--pulse); stroke-width: 3.5; stroke-dasharray: 14 90; }
    .flow-orch { stroke: var(--route); stroke-dasharray: 6 140; }
    .flow-anchor {
      stroke: var(--anchor);
      stroke-width: 3.2;
      stroke-dasharray: 12 80;
      filter: drop-shadow(0 0 5px var(--anchor-glow));
    }
    .flow-fleet {
      stroke: var(--fleet);
      stroke-width: 2;
      stroke-dasharray: 8 100;
      filter: none;
      opacity: 0.7;
    }

    .plane-tag {
      fill: var(--fog-dim);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .breath { animation: breath 3.6s ease-in-out infinite; }
    .breath-delay { animation-delay: 1.1s; }
    .breath-delay-2 { animation-delay: 2.2s; }

    .fleet-unit {
      transition: opacity 0.9s ease;
    }

    .link-unit {
      transition: opacity 0.7s ease;
    }

    @keyframes breath {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.06); }
    }

    @keyframes brand-sheen {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .breath, .brand-title span { animation: none !important; }
      .edge-flow { display: none; }
      .fleet-unit, .link-unit { transition: none; }
    }

    html[data-motion="off"] .breath,
    html[data-motion="off"] .brand-title span { animation: none !important; }
    html[data-motion="off"] .edge-flow { display: none; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="frame">
      <header class="brand">
        <p class="brand-kicker">Distributed Media Edge · Fleet</p>
        <h1 class="brand-title"><span>Media Hub</span></h1>
        <p class="brand-lead">Система дистанционного администрирования флота экранов</p>
      </header>
      <div class="graph-wrap" aria-hidden="true">
        <svg id="graph" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <footer class="meta">
        <span>Overlay → Scheduler → <b>Bootstrap</b></span>
        <span>Control · Media · Content</span>
        <span id="fleet-tag" class="live">флот · —</span>
        <span id="layout-tag">layout · auto</span>
      </footer>
    </div>
  </div>
  <script>
(function () {
  "use strict";

  const FLEET_COUNT = 10;
  /** Длина полного цикла появления/исчезновения флота (сек). */
  const CYCLE_SEC = 48;
  const params = new URLSearchParams(location.search);
  const hashParams = new URLSearchParams(String(location.hash || "").replace(/^#/, "").replace(/^\/?/, ""));
  function q(name, fallback) {
    return params.get(name) || hashParams.get(name) || fallback;
  }
  const layoutParam = q("layout", "auto");
  const motionParam = q("motion", null);
  const seedParam = parseInt(q("seed", "77"), 10);

  const root = document.documentElement;
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("field");
  const ctx = canvas.getContext("2d", { alpha: true });
  const graph = document.getElementById("graph");
  const layoutTag = document.getElementById("layout-tag");
  const fleetTag = document.getElementById("fleet-tag");

  const reduced =
    motionParam === "off" ||
    (motionParam !== "on" && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  root.dataset.motion = reduced ? "off" : "on";

  function mulberry32(a) {
    return function () {
      let t = (a += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const rand = mulberry32(Number.isFinite(seedParam) ? seedParam : 77);

  let layout = "landscape";
  let dpr = 1;
  let w = 0;
  let h = 0;
  let particles = [];
  let raf = 0;
  let running = false;
  let t0 = performance.now();
  let hubs = null;
  let fleet = [];
  let vb = [0, 0, 1100, 640];

  function resolveLayout() {
    if (layoutParam === "portrait" || layoutParam === "landscape") return layoutParam;
    return h > w ? "portrait" : "landscape";
  }

  function hubLayout() {
    if (layout === "portrait") {
      return {
        vb: [0, 0, 720, 1100],
        control: { x: 360, y: 150, label: "Control Server", sub: "Control Plane" },
        media: { x: 360, y: 420, label: "Media Server", sub: "MediaMTX · Media Plane" },
        anchor: { x: 360, y: 720, label: "Этот Android TV", sub: "якорь · Display" },
        zone: { x0: 40, y0: 90, x1: 680, y1: 1040 },
        tags: [
          { x: 80, y: 290, text: "desired / commands" },
          { x: 500, y: 560, text: "SRT · RTSP · live" },
        ],
      };
    }
    return {
      vb: [0, 0, 1100, 640],
      control: { x: 160, y: 300, label: "Control Server", sub: "Control Plane" },
      media: { x: 470, y: 160, label: "Media Server", sub: "MediaMTX · Media Plane" },
      anchor: { x: 860, y: 420, label: "Этот Android TV", sub: "якорь · Display" },
      zone: { x0: 280, y0: 70, x1: 1070, y1: 600 },
      tags: [
        { x: 280, y: 400, text: "Control Plane" },
        { x: 560, y: 120, text: "Media Plane" },
      ],
    };
  }

  function curve(a, b, bend) {
    const mx = (a.x + b.x) / 2;
    const my = (a.y + b.y) / 2;
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const nx = -dy;
    const ny = dx;
    const len = Math.hypot(nx, ny) || 1;
    const cx = mx + (nx / len) * bend;
    const cy = my + (ny / len) * bend;
    return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
  }

  function bendFor(a, b, base) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const side = dx * 0.002 - dy * 0.002;
    return base + side * 40;
  }

  function seedFleet(zone) {
    const list = [];
    const mediaY = hubs ? hubs.media.y : zone.y0 + (zone.y1 - zone.y0) * 0.2;
    const controlY = hubs ? hubs.control.y : zone.y0 + (zone.y1 - zone.y0) * 0.4;
    const midY = hubs ? (hubs.anchor.y + hubs.media.y) / 2 : zone.y0 + (zone.y1 - zone.y0) * 0.65;
    for (let i = 0; i < FLEET_COUNT; i++) {
      const band = i % 3;
      const cy = band === 0 ? mediaY : band === 1 ? controlY : midY;
      const x = zone.x0 + 40 + rand() * (zone.x1 - zone.x0 - 80);
      const y = Math.min(zone.y1 - 30, Math.max(zone.y0 + 30, cy + (rand() - 0.5) * 80));
      const slot = i / FLEET_COUNT;
      const visibleFrac = 0.55 + (i % 3) * 0.08;
      list.push({
        id: i,
        label: "TV-" + String(i + 1).padStart(2, "0"),
        x: x,
        y: y,
        tx: x,
        ty: y,
        vx: (rand() - 0.5) * 0.1,
        vy: (rand() - 0.5) * 0.1,
        visible: true,
        opacity: 1,
        phase: slot * Math.PI * 2,
        cycleOffset: slot,
        visibleFrac: Math.min(0.82, visibleFrac),
        wanderPhase: rand() * Math.PI * 2,
        bendC: 40 + rand() * 80,
        bendM: -30 - rand() * 70,
        homeX: x,
        homeY: y,
      });
    }
    return list;
  }

  function orbitTarget(zone, tv, t) {
    const zw = zone.x1 - zone.x0;
    const zh = zone.y1 - zone.y0;
    // Разносим по «полосам» высоты: часть у Media, часть у Control, часть ниже к якорю.
    const band = tv.id % 3;
    const cy =
      band === 0 ? hubs.media.y :
      band === 1 ? hubs.control.y :
      (hubs.anchor.y + hubs.media.y) / 2;
    const cx = zone.x0 + zw * (0.35 + (tv.id % 5) * 0.12);
    const rx = zw * (0.22 + (tv.id % 4) * 0.05);
    const ry = zh * (0.12 + (tv.id % 3) * 0.04);
    const ang = tv.wanderPhase + t * (0.12 + (tv.id % 5) * 0.018);
    let x = cx + Math.cos(ang) * rx + Math.sin(ang * 0.7 + tv.phase) * 16;
    let y = cy + Math.sin(ang * 0.95) * ry + Math.cos(ang * 0.55) * 12;
    const ax = hubs.anchor.x;
    const ay = hubs.anchor.y;
    if (Math.hypot(x - ax, y - ay) < 95) {
      const dx = x - ax || 1;
      const dy = y - ay || 1;
      const len = Math.hypot(dx, dy);
      x = ax + (dx / len) * 110;
      y = ay + (dy / len) * 110;
    }
    // Не наезжать на Control / Media
    [hubs.control, hubs.media].forEach((hub) => {
      if (Math.hypot(x - hub.x, y - hub.y) < 70) {
        const dx = x - hub.x || 1;
        const dy = y - hub.y || 1;
        const len = Math.hypot(dx, dy);
        x = hub.x + (dx / len) * 78;
        y = hub.y + (dy / len) * 78;
      }
    });
    tv.tx = Math.min(zone.x1 - 16, Math.max(zone.x0 + 16, x));
    tv.ty = Math.min(zone.y1 - 16, Math.max(zone.y0 + 16, y));
  }

  /** Цикл: фаза 0..1 → видимость с мягкими краями. */
  function cycleVisible(tv, t) {
    const u = ((t / CYCLE_SEC) + tv.cycleOffset) % 1;
    const on = tv.visibleFrac;
    const fade = 0.08;
    if (u < fade) return u / fade;
    if (u < on) return 1;
    if (u < on + fade) return 1 - (u - on) / fade;
    return 0;
  }

  function applyLayout() {
    layout = resolveLayout();
    root.dataset.layout = layout;
    layoutTag.textContent = "layout · " + (layoutParam === "auto" ? layout + " (auto)" : layout);
    hubs = hubLayout();
    vb = hubs.vb;
    if (!fleet.length) fleet = seedFleet(hubs.zone);
    else {
      fleet.forEach((tv) => {
        tv.x = Math.min(hubs.zone.x1 - 20, Math.max(hubs.zone.x0 + 20, tv.x));
        tv.y = Math.min(hubs.zone.y1 - 20, Math.max(hubs.zone.y0 + 20, tv.y));
        orbitTarget(hubs.zone, tv, 0);
      });
    }
    buildGraph();
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    w = Math.max(1, Math.floor(rect.width));
    h = Math.max(1, Math.floor(rect.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seedParticles();
    applyLayout();
  }

  function seedParticles() {
    const count = Math.round(Math.min(140, Math.max(48, (w * h) / 14000)));
    particles = [];
    for (let i = 0; i < count; i++) {
      particles.push({
        x: rand() * w,
        y: rand() * h,
        vx: (rand() - 0.5) * 0.35,
        vy: (rand() - 0.5) * 0.35,
        r: 0.6 + rand() * 1.8,
        hue: rand() < 0.4 ? "anchor" : rand() < 0.75 ? "fleet" : "route",
        life: rand(),
      });
    }
  }

  function hubNodeHtml(key, p, breathCls, opts) {
    const rCore = opts.core || 22;
    const rMid = opts.mid || 34;
    const rOut = opts.out || 46;
    const labelY = p.y + (opts.labelOff || 64);
    const subY = labelY + 18;
    const glow = opts.glow
      ? `<circle class="node-glow" cx="${p.x}" cy="${p.y}" r="${rOut + 10}" />`
      : "";
    return `
      <g class="node-${key}" id="node-${key}">
        ${glow}
        <circle class="node-ring ${breathCls}" cx="${p.x}" cy="${p.y}" r="${rOut}" />
        <circle class="node-ring" cx="${p.x}" cy="${p.y}" r="${rMid}" opacity="0.35" />
        <circle class="node-core" cx="${p.x}" cy="${p.y}" r="${rCore}" />
        <text class="node-label" x="${p.x}" y="${labelY}" text-anchor="middle">${p.label}</text>
        <text class="node-sub" x="${p.x}" y="${subY}" text-anchor="middle">${p.sub}</text>
      </g>`;
  }

  function buildGraph() {
    const n = hubs;
    graph.setAttribute("viewBox", n.vb.join(" "));

    const bends = layout === "portrait"
      ? { cm: -80, ca: 100, ma: -70 }
      : { cm: -60, ca: 80, ma: -40 };

    const paths = {
      orch: curve(n.control, n.media, bends.cm),
      controlAnchor: curve(n.control, n.anchor, bends.ca),
      mediaAnchor: curve(n.media, n.anchor, bends.ma),
    };

    const parts = [];
    parts.push(`<g id="links-fleet"></g>`);
    parts.push(`<path class="edge-path edge-orch" d="${paths.orch}" />`);
    parts.push(`<path class="edge-path edge-anchor-c" d="${paths.controlAnchor}" />`);
    parts.push(`<path class="edge-path edge-anchor-m" d="${paths.mediaAnchor}" />`);

    if (!reduced) {
      parts.push(`<path class="edge-flow flow-orch" id="flow-orch" d="${paths.orch}" />`);
      parts.push(`<path class="edge-flow flow-control" id="flow-control" d="${paths.controlAnchor}" />`);
      parts.push(`<path class="edge-flow flow-anchor" id="flow-anchor" d="${paths.mediaAnchor}" />`);
    }

    n.tags.forEach((t) => {
      parts.push(`<text class="plane-tag" x="${t.x}" y="${t.y}">${t.text}</text>`);
    });

    parts.push(`<g id="fleet-layer"></g>`);

    parts.push(hubNodeHtml("control", n.control, "breath", { core: 22, mid: 34, out: 46, labelOff: layout === "portrait" ? 54 : 58 }));
    parts.push(hubNodeHtml("media", n.media, "breath breath-delay", { core: 22, mid: 34, out: 46, labelOff: layout === "portrait" ? 54 : 58 }));
    parts.push(hubNodeHtml("anchor", n.anchor, "breath breath-delay-2", {
      core: 28,
      mid: 42,
      out: 58,
      labelOff: layout === "portrait" ? 72 : 76,
      glow: true,
    }));

    graph.innerHTML = parts.join("");
    renderFleetDom();
  }

  function renderFleetDom() {
    const layer = document.getElementById("fleet-layer");
    const links = document.getElementById("links-fleet");
    if (!layer || !links || !hubs) return;

    const nodeParts = [];
    const linkParts = [];

    fleet.forEach((tv) => {
      const op = tv.opacity;
      const showLinks = op > 0.05;
      nodeParts.push(`
        <g class="node-fleet fleet-unit" id="fleet-${tv.id}" opacity="${op}" transform="translate(${tv.x}, ${tv.y})">
          <circle class="node-ring" cx="0" cy="0" r="28" />
          <circle class="node-ring" cx="0" cy="0" r="20" opacity="0.3" />
          <circle class="node-core" cx="0" cy="0" r="13" />
          <text class="node-label" x="0" y="42" text-anchor="middle">${tv.label}</text>
        </g>`);

      if (showLinks || !reduced) {
        const pt = { x: tv.x, y: tv.y };
        const dC = curve(hubs.control, pt, bendFor(hubs.control, pt, tv.bendC * 0.4));
        const dM = curve(hubs.media, pt, bendFor(hubs.media, pt, tv.bendM * 0.35));
        const linkOp = Math.max(0, Math.min(1, (op - 0.1) / 0.9));
        linkParts.push(`
          <g class="link-unit" id="links-${tv.id}" opacity="${linkOp}">
            <path class="edge-path edge-fleet-c" d="${dC}" />
            <path class="edge-path edge-fleet-m" d="${dM}" />
            ${reduced ? "" : `<path class="edge-flow flow-fleet" data-flow="${tv.id}" d="${dM}" />`}
          </g>`);
      }
    });

    links.innerHTML = linkParts.join("");
    layer.innerHTML = nodeParts.join("");
  }

  function updateFleet(dt, t) {
    if (!hubs) return;
    let online = 0;
    let needRebuild = false;

    fleet.forEach((tv) => {
      const targetOp = reduced ? (tv.cycleOffset < tv.visibleFrac ? 1 : 0) : cycleVisible(tv, t);
      tv.visible = targetOp > 0.5;
      tv.opacity = reduced ? targetOp : tv.opacity + (targetOp - tv.opacity) * Math.min(1, dt * 3.2);
      if (tv.opacity < 0.01) tv.opacity = 0;
      if (tv.opacity > 0.99) tv.opacity = 1;

      if (!reduced && tv.opacity > 0.02) {
        orbitTarget(hubs.zone, tv, t);
        const ax = tv.tx - tv.x;
        const ay = tv.ty - tv.y;
        tv.vx = tv.vx * 0.94 + ax * 0.012;
        tv.vy = tv.vy * 0.94 + ay * 0.012;
        const sp = Math.hypot(tv.vx, tv.vy);
        const maxSp = 22 * dt;
        if (sp > maxSp && sp > 0) {
          tv.vx = (tv.vx / sp) * maxSp;
          tv.vy = (tv.vy / sp) * maxSp;
        }
        tv.x += tv.vx;
        tv.y += tv.vy;
        tv.x = Math.min(hubs.zone.x1 - 10, Math.max(hubs.zone.x0 + 10, tv.x));
        tv.y = Math.min(hubs.zone.y1 - 10, Math.max(hubs.zone.y0 + 10, tv.y));
      }

      if (tv.opacity > 0.35) online += 1;
      if (!document.getElementById("fleet-" + tv.id)) needRebuild = true;
    });

    fleetTag.textContent = "флот · online " + (online + 1) + "/" + (FLEET_COUNT + 1);

    if (needRebuild) {
      renderFleetDom();
      return;
    }

    fleet.forEach((tv) => {
      const g = document.getElementById("fleet-" + tv.id);
      if (g) {
        g.setAttribute("transform", "translate(" + tv.x + ", " + tv.y + ")");
        g.setAttribute("opacity", String(tv.opacity));
      }

      const lg = document.getElementById("links-" + tv.id);
      const linkOp = Math.max(0, Math.min(1, (tv.opacity - 0.1) / 0.9));
      if (lg) {
        lg.setAttribute("opacity", String(linkOp));
        const pt = { x: tv.x, y: tv.y };
        const paths = lg.querySelectorAll("path");
        const dC = curve(hubs.control, pt, bendFor(hubs.control, pt, tv.bendC * 0.4));
        const dM = curve(hubs.media, pt, bendFor(hubs.media, pt, tv.bendM * 0.35));
        if (paths[0]) paths[0].setAttribute("d", dC);
        if (paths[1]) paths[1].setAttribute("d", dM);
        if (paths[2]) paths[2].setAttribute("d", dM);
      }
    });
  }

  function fieldVector(x, y, t) {
    const nx = x / w;
    const ny = y / h;
    if (layout === "portrait") {
      return {
        x: Math.sin((ny + t * 0.05) * Math.PI * 2) * 0.45,
        y: 0.55 + Math.cos((nx + t * 0.03) * Math.PI * 2) * 0.25,
      };
    }
    return {
      x: 0.55 + Math.sin((ny * 2 + t * 0.04) * Math.PI) * 0.35,
      y: Math.cos((nx * 2 - t * 0.03) * Math.PI) * 0.28,
    };
  }

  function drawField(t) {
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#0e1418");
    g.addColorStop(0.45, "#132028");
    g.addColorStop(1, "#10181f");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const blobs = layout === "portrait"
      ? [[0.5, 0.15], [0.5, 0.4], [0.5, 0.72]]
      : [[0.16, 0.48], [0.42, 0.28], [0.78, 0.62]];
    blobs.forEach((b, i) => {
      const rg = ctx.createRadialGradient(b[0] * w, b[1] * h, 0, b[0] * w, b[1] * h, Math.min(w, h) * 0.35);
      const c = i === 0 ? "126,182,212" : i === 1 ? "212,162,74" : "61,206,110";
      rg.addColorStop(0, `rgba(${c},0.14)`);
      rg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, w, h);
    });

    if (reduced) return;

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const f = fieldVector(p.x, p.y, t);
      p.vx = p.vx * 0.92 + f.x * 0.08;
      p.vy = p.vy * 0.92 + f.y * 0.08;
      p.x += p.vx;
      p.y += p.vy;
      p.life += 0.002;
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
      if (p.y < -10) p.y = h + 10;
      if (p.y > h + 10) p.y = -10;

      const alpha = 0.15 + 0.35 * (0.5 + 0.5 * Math.sin(p.life * 6 + i));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle =
        p.hue === "anchor" ? `rgba(61,206,110,${alpha})` :
        p.hue === "fleet" ? `rgba(91,143,212,${alpha})` :
        `rgba(212,162,74,${alpha})`;
      ctx.fill();
    }

    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = 1;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      const y0 = (h * (0.25 + k * 0.22) + Math.sin(t * 0.4 + k) * 12) % h;
      for (let x = 0; x <= w; x += 12) {
        const f = fieldVector(x, y0, t + k);
        const y = y0 + Math.sin(x * 0.01 + t * 0.8 + k) * 18 + f.y * 8;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = k === 2 ? "rgba(61,206,110,0.08)" : "rgba(91,143,212,0.07)";
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function animateFlows(t) {
    if (reduced) return;
    const specs = [
      ["flow-anchor", 85, 0],
      ["flow-control", 140, 0.33],
      ["flow-orch", 170, 0.66],
    ];
    specs.forEach(([id, period, phase]) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.strokeDashoffset = String(-((t * 40 + phase * period) % period));
    });
    document.querySelectorAll("[data-flow]").forEach((el, i) => {
      el.style.strokeDashoffset = String(-((t * 32 + i * 28) % 110));
    });
  }

  let lastNow = 0;
  function frame(now) {
    if (!running) return;
    const t = (now - t0) / 1000;
    const dt = lastNow ? Math.min(0.05, (now - lastNow) / 1000) : 0.016;
    lastNow = now;
    drawField(t);
    if (!reduced) updateFleet(dt, t);
    else {
      const online = fleet.filter((tv) => tv.opacity > 0.35).length;
      fleetTag.textContent = "флот · online " + (online + 1) + "/" + (FLEET_COUNT + 1);
    }
    animateFlows(t);
    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (running || document.hidden) return;
    running = true;
    t0 = performance.now();
    lastNow = 0;
    raf = requestAnimationFrame(frame);
    if (reduced) {
      drawField(0);
      renderFleetDom();
    }
  }

  function stop() {
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stop();
    else start();
  });

  const ro = new ResizeObserver(() => resize());
  ro.observe(stage);
  resize();
  start();
})();
  </script>
</body>
</html>
